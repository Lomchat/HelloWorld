name: 🐛 Bug report
description: Report a deviation from the expected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in this form as completely as possible.

        **Security issues must not be reported here.** See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What did you expect to see?
      value: |
        Hello, World!
      render: text
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Please paste the output of `hello-world | od -c`.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -c "import hello_world; print(hello_world.__version__)"`
      placeholder: "2.3.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true

  - type: dropdown
    id: entry-point
    attributes:
      label: How do you run the application?
      multiple: true
      options:
        - hello-world (console script)
        - python -m hello_world
        - Python API (greet / main)
        - Docker
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I can reproduce the bug with the latest version.
          required: true
