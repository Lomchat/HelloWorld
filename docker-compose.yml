services:
  hello-world:
    build:
      context: .
      dockerfile: Dockerfile
    image: hello-world:latest
    container_name: hello-world
    # The application prints the greeting and exits: do not restart it.
    restart: "no"
    # Hardening: read-only filesystem, no privileges, no capabilities.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
